<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот с фильтром мата</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            height: 550px;
            background: #2b2b3b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .chat-header {
            background: #3b3b4f;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #444;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #007bff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: #44445a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .system-warning {
            background-color: #ff4d4d;
            color: white;
            align-self: center;
            font-size: 12px;
            text-align: center;
            border-radius: 6px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #222230;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            outline: none;
            background: #3b3b4f;
            color: #fff;
        }

        button {
            padding: 12px 18px;
            margin-left: 8px;
            background: #007bff;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">ИИ Помощник</div>
    <div class="chat-messages" id="chatBox">
        <div class="message bot-message">Привет! Я чат-бот. Задай мне вопрос!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    // 1. Список запрещенных слов (можно дополнять)
    const badWords = [
        "блять", "бля", "сука", "нах", "нахуй", "похуй", 
        "пиздец", "хуй", "пизда", "ебать", "долбоеб", "чмо"
    ];

    // 2. Функция проверки текста на мат
    function containsBadWords(text) {
        const lowerText = text.toLowerCase();
        
        // Проверяем каждое слово из списка запрещенных
        return badWords.some(word => {
            // Регулярное выражение ищет слово, даже если его пытаются скрыть или повторить буквы
            const regex = new RegExp(word, 'i');
            return regex.test(lowerText);
        });
    }

    // 3. Функция отправки сообщения
    function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim();

        if (userText === "") return;

        // ПРОВЕРКА НА МАТ
        if (containsBadWords(userText)) {
            // Если найден мат — блокируем и показываем предупреждение
            addMessage("Ваше сообщение содержит ненормативную лексику и не отправлено!", "system-warning");
            
            setTimeout(() => {
                addMessage("Пожалуйста, общайтесь вежливо.", "bot-message");
            }, 500);

            inputField.value = "";
            return; // Прерываем выполнение, сообщение пользователя НЕ добавляется в чат
        }

        // Если всё в порядке — отображаем сообщение пользователя
        addMessage(userText, "user-message");
        inputField.value = "";

        // Ответ бота
        setTimeout(() => {
            getBotResponse(userText);
        }, 600);
    }

    // 4. Добавление сообщения в окно чата
    function addMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Автоскролл вниз
    }

    // 5. Простой ответ бота
    function getBotResponse(userText) {
        const lower = userText.toLowerCase();
        let reply = "Я пока только учусь. Попробуй спросить что-то другое!";

        if (lower.includes("привет") || lower.includes("здравствуй")) {
            reply = "Привет! Чем могу помочь?";
        } else if (lower.includes("как дела")) {
            reply = "Отлично! Работаю без сбоев.";
        } else if (lower.includes("кто ты")) {
            reply = "Я чат-бот с встроенным фильтром мата!";
        }

        addMessage(reply, "bot-message");
    }
</script>

</body>
</html>
