<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Школьный ИИ</title>
    <style>
        /* Красивый и современный дизайн встроен прямо сюда */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #252540 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }
        .chat-container {
            width: 420px;
            height: 600px;
            background: #11111b;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2e2e48;
        }
        .chat-header {
            background: #6c5ce7;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .chat-header h2 { font-size: 20px; }
        .chat-header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #181825;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .user-message {
            background: #6c5ce7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: #313244;
            color: #cdd6f4;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .loading {
            color: #a6adc8;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .chat-input-area {
            padding: 15px;
            background: #11111b;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2e2e48;
        }
        input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid #45475a;
            background: #313244;
            color: white;
            border-radius: 30px;
            outline: none;
            font-size: 14px;
        }
        input::placeholder { color: #bac2de; }
        button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover { background: #5649c0; transform: scale(1.03); }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 Мой ИИ-Ассистент</h2>
            <p>Школьный проект</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Привет! Я готовая нейросеть. Задай мне любой вопрос, и я отвечу!</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const messageText = inputElement.value.trim();
            if (!messageText) return;

            appendMessage(messageText, 'user-message');
            inputElement.value = '';

            const loadingId = appendMessage('Нейросеть думает...', 'bot-message loading');

            try {
                // Прямой запрос к надежному ИИ без посредников
                const response = await fetch(`https://pollinations.ai{encodeURIComponent(messageText)}`);
                
                if (!response.ok) throw new Error();
                const aiText = await response.text();
                
                document.getElementById(loadingId).remove();
                appendMessage(aiText, 'bot-message');
            } catch (error) {
                document.getElementById(loadingId).textContent = 'Ошибка соединения. Попробуйте еще раз.';
                document.getElementById(loadingId).classList.remove('loading');
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            const messageId = 'msg-' + Date.now();
            messageDiv.id = messageId;
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageId;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
