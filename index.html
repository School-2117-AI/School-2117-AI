<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Школы 2117</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%); height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff; }
        .chat-container { width: 420px; height: 600px; background: #0d0b18; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #3d2b70; }
        .chat-header { background: linear-gradient(90deg, #1b1437, #251c44); color: white; padding: 22px; text-align: center; border-bottom: 2px solid #6c5ce7; }
        .chat-header h2 { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #a55eea; text-shadow: 0 0 10px rgba(165, 94, 234, 0.6); text-transform: uppercase; }
        .chat-header p { font-size: 11px; opacity: 0.7; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; color: #55efc4; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #120e24; display: flex; flex-direction: column; gap: 14px; }
        .message { padding: 12px 16px; border-radius: 20px; max-width: 85%; word-wrap: break-word; font-size: 15px; line-height: 1.45; }
        .user-message { background: #6c5ce7; color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3); }
        .bot-message { background: #211a3b; color: #e2dbff; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #31275c; }
        .loading { color: #a6adc8; font-style: italic; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .chat-input-area { padding: 15px; background: #0d0b18; display: flex; gap: 10px; border-top: 1px solid #251c44; }
        input { flex: 1; padding: 14px 20px; border: 1px solid #3d2b70; background: #1a1435; color: white; border-radius: 30px; outline: none; font-size: 14px; }
        button { background: linear-gradient(90deg, #6c5ce7, #a55eea); color: white; border: none; padding: 0 24px; border-radius: 30px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>ИИ Школы 2117</h2>
            <p>🟢 Прямое нейросетевое подключение</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Привет! Соединение с сервером ИИ установлено. Задай мне любой вопрос, и я отвечу как настоящая нейросеть!</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Напишите сообщение нейросети..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>
    <script>
        // Функция добавления сообщений в окно чата
        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            const messageId = 'msg-' + Date.now();
            
            messageDiv.id = messageId;
            messageDiv.className = 'message ' + className;
            messageDiv.textContent = text;
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Автоматическая прокрутка вниз
            return messageId;
        }

        // Обработка нажатия клавиши Enter для отправки
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        // Главная функция общения с ИИ
        async function sendMessage() {
            const inputElement = document.getElementById('userInput');
            let text = inputElement.value.trim();
            if (!text) return;

            // Выводим сообщение пользователя на экран
            appendMessage(text, 'user-message');
            inputElement.value = '';

            // Показываем анимацию ожидания
            const loadingId = appendMessage('ИИ генерирует ответ...', 'bot-message loading');

            let cleanText = text.trim();

            try {
                // Прямой запрос к надежному ИИ без блокировок CORS
                const response = await fetch(`https://pollinations.ai{encodeURIComponent(cleanText)}`);
                
                if (!response.ok) throw new Error("Сбой сети");
                const aiText = await response.text();
                
                // Удаляем индикатор загрузки и выводим ответ ИИ
                document.getElementById(loadingId).remove();
                appendMessage(aiText, 'bot-message');
            } catch (error) {
                // Если нет интернета или сервер ИИ перегружен — включаем умный локальный калькулятор
                document.getElementById(loadingId).remove();
                
                // Проверяем, ввёл ли пользователь математику (только цифры и знаки операций)
                if (/^[0-9\+\-\*\/\(\)\. ]+\$/.test(cleanText) && /[0-9]/.test(cleanText)) {
                    // Защита от недописанных примеров вроде "2+"
                    if (/[\+\-\*\/]\$/.test(cleanText)) {
                        appendMessage('[Локальный модуль]: Пример не закончен! Допишите число.', 'bot-message');
                        return;
                    }
                    try {
                        let result = Function('"use strict";return (' + cleanText + ')')();
                        appendMessage(`[Локальный калькулятор]: Результат равен ${result}`, 'bot-message');
                    } catch (e) {
                        appendMessage('[Локальный модуль]: Ошибка в выражении. Перепроверьте знаки!', 'bot-message');
                    }
                } else {
                    // Если это был обычный текст, просим повторить попытку
                    appendMessage('Сервер ИИ временно перегружен запросами. Пожалуйста, отправьте фразу ещё раз через пару секунд!', 'bot-message');
                }
            }
        }
    </script>
</body>
</html>
