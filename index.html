<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат-бот</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 420px;
            height: 580px;
            background: #2b2b3b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .chat-header {
            background: #3b3b4f;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #444;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background-color: #007bff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: #44445a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .system-warning {
            background-color: #ff4d4d;
            color: white;
            align-self: center;
            font-size: 12px;
            text-align: center;
            border-radius: 6px;
        }

        .system-info {
            background-color: #ff9800;
            color: #000;
            font-weight: bold;
            align-self: center;
            font-size: 12px;
            text-align: center;
            border-radius: 6px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #222230;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            outline: none;
            background: #3b3b4f;
            color: #fff;
        }

        button {
            padding: 12px 18px;
            margin-left: 8px;
            background: #007bff;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">ИИ Помощник</div>
    <div class="chat-messages" id="chatBox">
        <div class="message bot-message">Привет! Я чат-бот. Задай мне вопрос или напиши пример!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    const badWords = [
        "блять", "бля", "сука", "нах", "нахуй", "похуй", 
        "пиздец", "хуй", "пизда", "ебать", "долбоеб", "чмо"
    ];

    let teachState = 0; 
    let tempQuestion = "";
    let customKnowledge = JSON.parse(localStorage.getItem("botKnowledge")) || {};

    function containsBadWords(text) {
        const lowerText = text.toLowerCase();
        return badWords.some(word => new RegExp(word, 'i').test(lowerText));
    }

    function calculateMath(text) {
        const cleanText = text.replace(/\s+/g


, '');
        const isMathPattern = /^[\d\+\-\*\/\(\)\.]+$/;

        if (isMathPattern.test(cleanText)) {
            try {
                const result = new Function(`return ${cleanText}`)();
                if (typeof result === 'number' && !isNaN(result) && isFinite(result)) {
                    return result;
                }
            } catch (e) {
                return null;
            }
        }
        return null;
    }

    function sendMessage() {
        const inputField = document.getElementById("userInput");
        const userText = inputField.value.trim();

        if (userText === "") return;

        if (userText.toLowerCase() === "чк гавно") {
            addMessage(userText, "user-message");
            inputField.value = "";
            teachState = 1;
            addMessage("🔧 Режим обучения активирован!", "system-info");
            setTimeout(() => {
                addMessage("Напиши фразу или вопрос, которому хочешь меня научить:", "bot-message");
            }, 400);
            return;
        }

        if (teachState === 1) {
            addMessage(userText, "user-message");
            inputField.value = "";
            tempQuestion = userText.toLowerCase();
            teachState = 2;
            setTimeout(() => {
                addMessage(`Отлично! Теперь напиши, что я должен отвечать на фразу: "${userText}"`, "bot-message");
            }, 400);
            return;
        } 
        else if (teachState === 2) {
            addMessage(userText, "user-message");
            inputField.value = "";
            
            customKnowledge[tempQuestion] = userText;
            localStorage.setItem("botKnowledge", JSON.stringify(customKnowledge));
            
            teachState = 0;
            tempQuestion = "";

            setTimeout(() => {
                addMessage("✅ Готово! Я запомнил этот ответ.", "system-info");
            }, 400);
            return;
        }

        if (containsBadWords(userText)) {
            addMessage("Ваше сообщение содержит ненормативную лексику и не отправлено!", "system-warning");
            setTimeout(() => {
                addMessage("Пожалуйста, общайтесь вежливо.", "bot-message");
            }, 500);
            inputField.value = "";
            return;
        }

        addMessage(userText, "user-message");
        inputField.value = "";

        setTimeout(() => {
            getBotResponse(userText);
        }, 600);
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotResponse(userText) {
        const lower = userText.toLowerCase();

        const mathResult = calculateMath(userText);
        if (mathResult !== null) {
            addMessage(`Результат: ${mathResult}`, "bot-message");
            return;
        }

        if (customKnowledge[lower]) {
            addMessage(customKnowledge[lower], "bot-message");
            return;
        }

        for (let key in customKnowledge) {
            if (lower.includes(key)) {
                addMessage(customKnowledge[key], "bot-message");
                return;
            }
        }

        let reply = "Я пока не знаю, что ответить. Ты можешь научить меня с помощью команды 'чк гавно'!";

        if (lower.includes("привет") || lower.includes("здравствуй")) {
            reply = "Привет! Чем могу помочь?";
        } else if (lower.includes("как дела")) {
            reply = "Отлично! Учусь новым фразам.";
        } else if (lower.includes("кто ты")) {
            reply = "Я чат-бот, которого ты можешь обучать самостоятельно!";
        }

        addMessage(reply, "bot-message");
    }
</script>

</body>
</html>
